<?xml version="1.0" encoding="UTF-8"?>
<svg viewbox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" width="900" height="600">
<style>
svg{--bg:#F3F5F6;--surface:#FFFFFF;--ink:#18212B;--muted:#5A6673;--line:#D5DBE0;--bcm:#0E6B69;--bcm-soft:#DCEFEE;--llm:#A8661A;--llm-soft:#F6E9D6;--host:#44515E;--host-soft:#E6EAEE}
@media (prefers-color-scheme: dark){svg{--bg:#11161C;--surface:#18202A;--ink:#E3E8EE;--muted:#9AA7B4;--line:#2C3743;--bcm:#4FBDB9;--bcm-soft:#15302F;--llm:#E0A15A;--llm-soft:#33261A;--host:#A7B3BF;--host-soft:#222B35}}
text{font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:var(--ink)}
.t-muted{fill:var(--muted)}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.b-host{fill:var(--host-soft);stroke:var(--host);stroke-width:1.5}
.b-bcm{fill:var(--bcm-soft);stroke:var(--bcm);stroke-width:1.5}
.b-llm{fill:var(--llm-soft);stroke:var(--llm);stroke-width:1.5}
.vm{fill:var(--surface);stroke:var(--bcm);stroke-width:1.5}
.ct{fill:var(--surface);stroke:var(--llm);stroke-width:1.5}
.net-ext{stroke:var(--host);stroke-width:2.5;fill:none}
.net-int{stroke:var(--bcm);stroke-width:2.5;fill:none;stroke-dasharray:7 5}
.gpu{fill:var(--llm);fill-opacity:.18;stroke:var(--llm);stroke-width:1.5}
</style>
<rect x="0" y="0" width="900" height="600" fill="var(--bg)"/>
<!-- host -->
<rect class="b-host" height="580" rx="14" width="880" x="10" y="10"></rect>
<text font-size="18" font-weight="800" x="30" y="40">DGX Spark · GB10 (20 Arm cores, 128 GB unified memory)</text>
<text class="t-muted" font-size="14" x="30" y="62">DGX OS (Ubuntu 24.04 arm64) · KVM · libvirt · Docker + NVIDIA Container Toolkit</text>
<!-- BCM partition -->
<rect class="b-bcm" height="408" rx="10" width="470" x="30" y="82"></rect>
<text font-size="16" font-weight="800" x="48" y="108">BCM partition — machine.slice</text>
<text class="t-muted mono" font-size="13" x="48" y="128">AllowedCPUs=4,10-14 · MemoryMax=34G</text>
<!-- NAT net -->
<line class="net-ext" x1="60" x2="480" y1="160" y2="160"></line>
<text class="mono t-muted" font-size="12.5" x="62" y="152">virbr0 · "default" NAT · 192.168.122.0/24</text>
<!-- head VM -->
<rect class="vm" height="118" rx="8" width="230" x="60" y="190"></rect>
<text font-size="15" font-weight="700" x="76" y="215">bcm-head</text>
<text class="t-muted" font-size="12.5" x="76" y="236">4 vCPU · 20 GB · 120 GB</text>
<text class="mono" font-size="12.5" x="76" y="256">ext 192.168.122.10</text>
<text class="mono" font-size="12.5" x="76" y="274">int 10.141.255.254</text>
<text class="t-muted" font-size="12" x="76" y="294">DHCP · TFTP · CMDaemon · Slurm</text>
<line class="net-ext" x1="120" x2="120" y1="160" y2="190"></line>
<line class="net-int" x1="100" x2="100" y1="308" y2="380"></line>
<!-- internal net -->
<line class="net-int" x1="60" x2="480" y1="380" y2="380"></line>
<text class="mono" font-size="12.5" text-anchor="end" x="480" y="372"><tspan class="t-muted">bcm-internal · isolated · 10.141.0.0/16</tspan></text>
<!-- nodes -->
<rect class="vm" height="62" rx="8" width="190" x="60" y="410"></rect>
<text font-size="15" font-weight="700" x="76" y="435">node001</text>
<text class="t-muted" font-size="12.5" x="76" y="456">2 vCPU · 4 GB · PXE boot</text>
<line class="net-int" x1="155" x2="155" y1="380" y2="410"></line>
<rect class="vm" height="62" rx="8" width="190" x="280" y="410"></rect>
<text font-size="15" font-weight="700" x="296" y="435">node002</text>
<text class="t-muted" font-size="12.5" x="296" y="456">2 vCPU · 4 GB · PXE boot</text>
<line class="net-int" x1="375" x2="375" y1="380" y2="410"></line>
<text class="t-muted" font-size="12.5" x="308" y="215">No host IP on bcm-internal.</text>
<text class="t-muted" font-size="12.5" x="308" y="233">BCM's DHCP cannot leak</text>
<text class="t-muted" font-size="12.5" x="308" y="251">onto your home LAN.</text>
<!-- workload partition -->
<rect class="b-llm" height="408" rx="10" width="350" x="520" y="82"></rect>
<text font-size="16" font-weight="800" x="538" y="108">Workload partition</text>
<text class="t-muted mono" font-size="13" x="538" y="128">cpuset 5-9,15-19 · ~80 GB left</text>
<rect class="gpu" height="70" rx="8" width="310" x="540" y="148"></rect>
<text font-size="15" font-weight="700" x="558" y="178">GB10 Blackwell GPU</text>
<text class="t-muted" font-size="12.5" x="558" y="199">host only · not passed to VMs</text>
<rect class="ct" height="56" rx="8" width="148" x="540" y="236"></rect>
<text font-size="14" font-weight="700" x="554" y="260">vLLM / NIM</text>
<text class="t-muted" font-size="12" x="554" y="279">container</text>
<rect class="ct" height="56" rx="8" width="148" x="702" y="236"></rect>
<text font-size="14" font-weight="700" x="716" y="260">Ollama</text>
<text class="t-muted" font-size="12" x="716" y="279">container</text>
<rect class="ct" height="56" rx="8" width="148" x="540" y="306"></rect>
<text font-size="14" font-weight="700" x="554" y="330">Open WebUI</text>
<text class="t-muted" font-size="12" x="554" y="349">container</text>
<rect class="ct" height="56" rx="8" width="148" x="702" y="306"></rect>
<text font-size="14" font-weight="700" x="716" y="330">Jupyter, tools</text>
<text class="t-muted" font-size="12" x="716" y="349">container</text>
<text class="t-muted" font-size="12.5" x="540" y="398">Framework-level memory caps</text>
<text class="t-muted" font-size="12.5" x="540" y="416">(e.g. --gpu-memory-utilization)</text>
<text class="t-muted" font-size="12.5" x="540" y="434">keep models out of VM memory.</text>
<!-- host reserved -->
<rect fill="none" height="64" rx="10" stroke="var(--host)" stroke-dasharray="4 4" stroke-width="1.5" width="840" x="30" y="508"></rect>
<text font-size="15" font-weight="700" x="48" y="535">Host reserve — cores 0-3, ~8 GB</text>
<text class="t-muted" font-size="11.5" x="48" y="556">DGX OS services, libvirtd, dockerd, desktop · Wi-Fi wlP9s9 → home LAN 192.168.0.0/24 (lab reached via SSH jump or port forwards)</text>
</svg>
